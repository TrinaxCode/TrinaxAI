version: 2
# One grouped pull request per ecosystem each month keeps the branch list short.
# Major-version bumps are ignored here and handled by hand when planned; GitHub
# security updates are separate and still open pull requests for vulnerable
# dependencies.
updates:
  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node.js (npm) dependencies — PWA frontend
  - package-ecosystem: "npm"
    directory: "/chat-pwa"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
