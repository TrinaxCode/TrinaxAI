name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"

      - name: Require release signing credentials
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_SIGNING_KEY_BASE64" || -z "$RELEASE_SIGNING_KEY_PASSPHRASE" || -z "$RELEASE_SIGNING_KEY_FINGERPRINT" ]]; then
            echo "Release signing credentials are required for tagged releases" >&2
            exit 1
          fi

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pip==26.2.1" \
            "setuptools==83.0.0" \
            "wheel==0.45.1"

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          frontend_version="$(node -p 'require("./chat-pwa/package.json").version')"
          lock_version="$(node -p 'require("./chat-pwa/package-lock.json").version')"
          source_update_version="$(sed -n 's/^RELEASE_VERSION = "\([^"]*\)"$/\1/p' scripts/source_update.py)"
          cli_version="$(sed -n 's/^VERSION = "\([^"]*\)"$/\1/p' trinaxai_cli/app.py)"
          test "$expected" = "$python_version"
          test "$expected" = "$frontend_version"
          test "$expected" = "$lock_version"
          test "$expected" = "$cli_version"
          test "$expected" = "$source_update_version"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          mkdir -p release
          git archive --format=tar --prefix="TrinaxAI-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "release/TrinaxAI-${version}.tar.gz"
          git archive --format=zip --prefix="TrinaxAI-${version}/" "${GITHUB_SHA}" \
            -o "release/TrinaxAI-${version}.zip"
          rm -rf build
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir release
          cp install.sh "release/TrinaxAI-${version}-installer.sh"
          cp install.ps1 "release/TrinaxAI-${version}-installer.ps1"

      - name: Sign and verify release assets
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_KEY_BASE64" | base64 --decode | gpg --batch --import
          signing_key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$signing_key" ]]; then
            echo "No release signing key was imported" >&2
            exit 1
          fi
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint "$signing_key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="${RELEASE_SIGNING_KEY_FINGERPRINT// /}"
          if [[ "${actual_fingerprint^^}" != "${expected_fingerprint^^}" ]]; then
            echo "Imported release signing key does not match the configured fingerprint" >&2
            exit 1
          fi
          gpg --batch --armor --export "$signing_key" > release/TrinaxAI-release-signing-key.asc
          printf '%s\n' "$actual_fingerprint" > release/TrinaxAI-release-signing-key.fingerprint
          (cd release && sha256sum TrinaxAI-* trinaxai-*.whl > SHA256SUMS)
          shopt -s nullglob
          assets=(release/TrinaxAI-* release/trinaxai-*.whl release/SHA256SUMS)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were available for signing" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            printf '%s' "$RELEASE_SIGNING_KEY_PASSPHRASE" |
              gpg --detach-sign --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$signing_key" --armor \
                --output "${asset}.asc" "$asset"
          done

      - name: Stage draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to overwrite an already-published release" >&2
              exit 1
            fi
            gh release upload "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --title "TrinaxAI ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Verify exact draft release assets and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TEMP}/release-expected.txt"
          actual="${RUNNER_TEMP}/release-draft-actual.txt"
          verify_dir="${RUNNER_TEMP}/release-draft-verify"
          find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
          is_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          [[ "$is_draft" == "true" ]] || {
            echo "Refusing to verify or publish a non-draft release candidate." >&2
            exit 1
          }
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort > "$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "Draft release assets differ from the signed local asset set." >&2
            exit 1
          fi
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "$verify_dir" --pattern '*'
          find "$verify_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort > "${RUNNER_TEMP}/release-draft-downloaded.txt"
          if ! diff -u "$expected" "${RUNNER_TEMP}/release-draft-downloaded.txt"; then
            echo "Downloaded draft assets differ from the staged asset set." >&2
            exit 1
          fi
          cd "$verify_dir"
          export GNUPGHOME="$RUNNER_TEMP/gnupg-release-draft"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import TrinaxAI-release-signing-key.asc
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="$(printf '%s' "$RELEASE_SIGNING_KEY_FINGERPRINT" | tr -d '[:space:]')"
          test -n "$actual_fingerprint"
          test "${actual_fingerprint^^}" = "${expected_fingerprint^^}"
          published_fingerprint="$(tr -d '[:space:]' < TrinaxAI-release-signing-key.fingerprint)"
          test "${published_fingerprint^^}" = "${actual_fingerprint^^}"
          sha256sum --check SHA256SUMS
          while read -r _digest asset; do
            if [[ -z "$asset" || ! -f "$asset" || ! -f "$asset.asc" ]]; then
              echo "Draft release asset is missing its detached signature: $asset" >&2
              exit 1
            fi
          done < SHA256SUMS
          shopt -s nullglob
          # The public signing key is itself an .asc asset. Detached
          # signatures therefore have the unambiguous .asc.asc suffix.
          signatures=(*.asc.asc)
          if (( ${#signatures[@]} == 0 )); then
            echo "Draft release contains no detached signatures" >&2
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            asset="${signature%.asc}"
            [[ -f "$asset" ]] || {
              echo "Draft release contains an orphan signature: $signature" >&2
              exit 1
            }
            gpg --batch --verify "$signature" "$asset" >/dev/null
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
        with:
          cosign-release: v2.5.3

      - name: Generate container metadata
        id: container
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish backend container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.container.outputs.tags }}
          labels: ${{ steps.container.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Sign and verify container images
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            cosign sign --yes "$image"
            cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/tags/${GITHUB_REF_NAME}$" \
              "$image" >/dev/null
          done <<< '${{ steps.container.outputs.tags }}'

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="${RUNNER_TEMP}/release-verify"
          expected="${RUNNER_TEMP}/release-published-expected.txt"
          actual="${RUNNER_TEMP}/release-published-actual.txt"
          find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
          mkdir -p "$verify_dir"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "$verify_dir"
          find "$verify_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort > "$actual"
          if ! diff -u "$expected" "$actual"; then
            echo "Published release assets differ from the signed local asset set." >&2
            exit 1
          fi
          cd "$verify_dir"
          export GNUPGHOME="$RUNNER_TEMP/gnupg-release-verify"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import TrinaxAI-release-signing-key.asc
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="$(printf '%s' "$RELEASE_SIGNING_KEY_FINGERPRINT" | tr -d '[:space:]')"
          test -n "$actual_fingerprint"
          test "${actual_fingerprint^^}" = "${expected_fingerprint^^}"
          test "$(tr -d '[:space:]' < TrinaxAI-release-signing-key.fingerprint | tr '[:lower:]' '[:upper:]')" = "${actual_fingerprint^^}"
          sha256sum --check SHA256SUMS
          while read -r _digest asset; do
            [[ -n "$asset" && -f "$asset" && -f "$asset.asc" ]] || {
              echo "Published release asset is missing its detached signature: $asset" >&2
              exit 1
            }
          done < SHA256SUMS
          shopt -s nullglob
          # The public signing key is itself an .asc asset. Detached
          # signatures therefore have the unambiguous .asc.asc suffix.
          signatures=(*.asc.asc)
          if (( ${#signatures[@]} == 0 )); then
            echo "Published release contains no detached signatures" >&2
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            asset="${signature%.asc}"
            [[ -f "$asset" ]] || {
              echo "Published release contains an orphan signature: $signature" >&2
              exit 1
            }
            gpg --batch --verify "$signature" "$asset" >/dev/null
          done
