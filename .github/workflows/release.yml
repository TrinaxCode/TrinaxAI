name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"

      - name: Require release signing credentials
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_SIGNING_KEY_BASE64" || -z "$RELEASE_SIGNING_KEY_PASSPHRASE" || -z "$RELEASE_SIGNING_KEY_FINGERPRINT" ]]; then
            echo "Release signing credentials are required for stable releases" >&2
            exit 1
          fi

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pip==26.2.1" \
            "setuptools==83.0.0" \
            "wheel==0.45.1"

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          frontend_version="$(node -p 'require("./chat-pwa/package.json").version')"
          lock_version="$(node -p 'require("./chat-pwa/package-lock.json").version')"
          source_update_version="$(sed -n 's/^RELEASE_VERSION = "\([^"]*\)"$/\1/p' scripts/source_update.py)"
          cli_version="$(sed -n 's/^VERSION = "\([^"]*\)"$/\1/p' trinaxai_cli/app.py)"
          test "$expected" = "$python_version"
          test "$expected" = "$frontend_version"
          test "$expected" = "$lock_version"
          test "$expected" = "$cli_version"
          test "$expected" = "$source_update_version"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          git archive --format=tar --prefix="TrinaxAI-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "release/TrinaxAI-${version}.tar.gz"
          git archive --format=zip --prefix="TrinaxAI-${version}/" "${GITHUB_SHA}" \
            -o "release/TrinaxAI-${version}.zip"
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir release
          cp install.sh "release/TrinaxAI-${version}-installer.sh"
          cp install.ps1 "release/TrinaxAI-${version}-installer.ps1"

      - name: Sign and verify release assets
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEY_BASE64 }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
          RELEASE_SIGNING_KEY_FINGERPRINT: ${{ secrets.RELEASE_SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_KEY_BASE64" | base64 --decode | gpg --batch --import
          signing_key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$signing_key" ]]; then
            echo "No release signing key was imported" >&2
            exit 1
          fi
          actual_fingerprint="$(gpg --batch --with-colons --fingerprint "$signing_key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="${RELEASE_SIGNING_KEY_FINGERPRINT// /}"
          if [[ "${actual_fingerprint^^}" != "${expected_fingerprint^^}" ]]; then
            echo "Imported release signing key does not match the configured fingerprint" >&2
            exit 1
          fi
          gpg --batch --armor --export "$signing_key" > release/TrinaxAI-release-signing-key.asc
          printf '%s\n' "$actual_fingerprint" > release/TrinaxAI-release-signing-key.fingerprint
          (cd release && sha256sum TrinaxAI-* trinaxai-*.whl > SHA256SUMS)
          shopt -s nullglob
          assets=(release/TrinaxAI-* release/trinaxai-*.whl release/SHA256SUMS)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were available for signing" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            printf '%s' "$RELEASE_SIGNING_KEY_PASSPHRASE" |
              gpg --detach-sign --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$signing_key" --armor \
                --output "${asset}.asc" "$asset"
            gpg --batch --verify "${asset}.asc" "$asset" >/dev/null
          done

      - name: Publish simple release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "TrinaxAI ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for expected in \
            "TrinaxAI-${GITHUB_REF_NAME#v}.tar.gz" \
            "TrinaxAI-${GITHUB_REF_NAME#v}.zip" \
            "TrinaxAI-${GITHUB_REF_NAME#v}-installer.sh" \
            "TrinaxAI-${GITHUB_REF_NAME#v}-installer.ps1" \
            "SHA256SUMS" \
            "TrinaxAI-release-signing-key.asc" \
            "TrinaxAI-release-signing-key.fingerprint" \
            "TrinaxAI-${GITHUB_REF_NAME#v}.tar.gz.asc" \
            "TrinaxAI-${GITHUB_REF_NAME#v}.zip.asc" \
            "trinaxai-${GITHUB_REF_NAME#v}-py3-none-any.whl.asc" \
            "TrinaxAI-${GITHUB_REF_NAME#v}-installer.sh.asc" \
            "TrinaxAI-${GITHUB_REF_NAME#v}-installer.ps1.asc" \
            "TrinaxAI-release-signing-key.asc.asc" \
            "TrinaxAI-release-signing-key.fingerprint.asc" \
            "SHA256SUMS.asc"; do
            if [[ $'\n'"$assets"$'\n' != *$'\n'"$expected"$'\n'* ]]; then
              echo "Missing published release asset: $expected" >&2
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 --output /dev/null \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected}"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
        with:
          cosign-release: v2.5.3

      - name: Generate container metadata
        id: container
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Publish backend container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.container.outputs.tags }}
          labels: ${{ steps.container.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Sign and verify container images
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            cosign sign --yes "$image"
            cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/tags/${GITHUB_REF_NAME}$" \
              "$image" >/dev/null
          done <<< '${{ steps.container.outputs.tags }}'
