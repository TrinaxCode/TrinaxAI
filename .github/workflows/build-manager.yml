name: Build desktop manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build desktop manager (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TrinaxAI-Manager-Windows
          - os: macos-latest
            artifact: TrinaxAI-Manager-macOS
          - os: ubuntu-latest
            artifact: TrinaxAI-Manager-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install "pyinstaller==6.22.2"
      - run: python scripts/build_manager.py --output manager-release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: manager-release/*
          if-no-files-found: error
