name: Test installers

on:
  push:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'update.sh'
      - 'update.ps1'
      - 'uninstall.sh'
      - 'uninstall.ps1'
      - 'test-installers.*'
      - 'TESTING.md'
      - '.github/workflows/test-installers.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'update.sh'
      - 'update.ps1'
      - 'uninstall.sh'
      - 'uninstall.ps1'
      - 'test-installers.*'
      - 'TESTING.md'
      - '.github/workflows/test-installers.yml'

jobs:
  shell:
    name: Shell installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run syntax and dry-run checks
        shell: bash
        run: ./test-installers.sh

  windows:
    name: PowerShell installers (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run PowerShell dry-run checks
        shell: pwsh
        run: .\test-installers.ps1
      - name: Run shell syntax and dry-run checks
        shell: bash
        run: ./test-installers.sh
