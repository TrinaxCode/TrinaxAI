[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinaxai"
version = "1.2.0"
description = "Command-line client for a local TrinaxAI installation."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "TrinaxCode" }
]
keywords = ["ai", "rag", "ollama", "local-first", "pwa", "cli", "llama-index"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The wheel is CLI-only. Full backend/PWA releases are installed from the
# signed source archives; the CLI discovers and controls that installation.
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.28.1",
  "prompt-toolkit>=3.0.48",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://www.trinaxai.app/"
Documentation = "https://github.com/TrinaxCode/TrinaxAI/blob/main/docs/README.md"
Repository = "https://github.com/TrinaxCode/TrinaxAI"
Changelog = "https://github.com/TrinaxCode/TrinaxAI/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/TrinaxCode/TrinaxAI/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "pip-audit>=2.10.1",
  "bandit>=1.9.4",
]

[project.scripts]
trinaxai = "trinaxai_cli.app:main"

[tool.setuptools]
py-modules = [
  "config",
  "trinaxai_core",
  "trinaxai_errors",
]

[tool.setuptools.packages.find]
include = [
  "trinaxai_cli*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  "chat-pwa/node_modules",
  "chat-pwa/dist",
  "storage",
  "storage.bak.nomic",
  "local_sources",
  "backups",
  "logs",
  "qa-test-workspace",
]

[tool.ruff.lint]
select = ["E7", "E9", "F", "I", "B", "SIM"]
# B008 is FastAPI's dependency declaration idiom. SIM105/SIM115 cover
# deliberate best-effort cleanup and library-owned file handles; SIM112 keeps
# the conventional TRINAXAI_* environment names readable; SIM117 leaves
# lock/semaphore scopes explicit.
ignore = ["E501", "B008", "SIM105", "SIM112", "SIM115", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["app/security", "app/services"]
follow_imports = "skip"
ignore_missing_imports = true
allow_untyped_defs = true
check_untyped_defs = true
